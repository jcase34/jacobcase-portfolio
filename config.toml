# Hugo Site Configuration
baseURL = "https://jacob-case.com/"
languageCode = "en-us"
title = "Jacob Case"
theme = "careercanvas"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    contentDir = "content/en"
    languageName = "English"
    weight = 1
    [languages.en.params]
      tagline = "Embedded hardware, software, and cloud connectivity. AWS, embedded Linux, web and iOS development."
      hero_description = "Program manager at Tria technologies, where we help businesses integrate embedded system-on-modules, customized software and BSPs, and system solutions for performant and edge IOT compute. I bridge product development with customer needs to ensure reliable and scalable growth."
      hero_location = "San Diego, CA"
      resume_url = ""
      collab_tags = [
        "AI agent security & compliance",
        "Guardrails & policy design",
        "Full-stack AI (Python / Next.js)",
        "Product-engineering & requirements",
        "Enterprise AI adoption"
      ]


[build]
  writeStats = true

[params]
name = "Jacob Case"
firstName = "Jacob"
lastName = "Case"
email = ""
profile_image = "/images/profile.jpg"
author = "Jacob"

og_image = ""

description = "Full-stack AI product engineer at Fireraven. Building guardrails, security, and compliance tooling for LLM agents—bridging product vision with AI systems engineering."

linkedin_url = "https://www.linkedin.com/in/jacob-case"
linkedin_text = "linkedin.com/in/jacob-case"
github_url = "https://github.com/jcase34"
github_text = "github.com/jcase34"


copyright = "Jacob Case"


resume_url_en = ""
resume_label = "View CV"

# Form and Pexels: set in config or config.local.toml. CI: HUGO_PARAMS_FORMSPREEENDPOINT, HUGO_PARAMS_PEXELSAPIKEY (no underscores)
formspreeendpoint = ""
pexelsapikey = ""

[[params.social]]
icon = "linkedin-in"
url = "https://www.linkedin.com/in/jacob-case/"

[[params.social]]
icon = "github"
url = "https://github.com/jcase34"

sectionPagesMenu = 'main'


[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"

[server]
  [[server.headers]]
    for = "/**/*.css"
    [server.headers.values]
      Content-Type = "text/css"

# Dynamic Color Palettes Configuration
# Multiple color palettes that will be randomly selected on each page load
# Each palette contains main_color, second_color, and third_color
[params.color_palettes]
